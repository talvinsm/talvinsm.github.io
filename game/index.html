<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electric Man 2</title>
  <style>
    body {
      background: #0b0f17;
      color: #e8eefb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      flex-direction: column;
    }
    #game-container {
      width: 800px;
      max-width: 95%;
      border: 2px solid #64b5ff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(100,181,255,0.5);
    }
    h1 {
      margin-bottom: 16px;
      font-size: 24px;
      text-align: center;
      color: #61ffa4;
    }
  </style>
</head>
<body>
  <h1>Electric Man 2 – Flash Game</h1>
  <div id="game-container"></div>

  <script src="ruffle.js"></script>
  <script>
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById("game-container").appendChild(player);
    player.load("ElectricMan2.swf");
  </script>
</body>
</html>
